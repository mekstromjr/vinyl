[project]
name = "vinyl-server"
version = "0.1.0"
description = "Vinyl service control plane (FastAPI, k8s). Ticket #1: schema + persistence layer."
requires-python = ">=3.12"
# NEVER add audio-capture deps here — the cluster does not touch the Scarlett.
dependencies = [
    "vinyl-shared",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.4",
    "reportlab>=4.2.5",
    "numpy>=2.1.0",
]

[tool.hatch.build.targets.wheel.force-include]
# Templates and static assets ship inside the wheel/image.
"src/vinyl_server/templates" = "vinyl_server/templates"
"src/vinyl_server/static" = "vinyl_server/static"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_server"]

[tool.uv.sources]
vinyl-shared = { workspace = true }
