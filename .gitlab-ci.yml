# vinyl CI
#
# test:  ruff + pytest (against a postgres service, so the Alembic DDL and
#        view-backed endpoints are exercised for real) + offline migration render
# build: Kaniko -> registry.meklab.net/meklab/vinyl
#        :<short-sha> always, :latest on main, :<tag> on semver tag (the
#        production artifact — manifests pin that tag)

stages:
  - test
  - build

variables:
  REGISTRY: registry.meklab.net
  IMAGE_PATH: $CI_PROJECT_PATH

lint-and-test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16.9
      alias: postgres
  variables:
    POSTGRES_DB: vinyl_test
    POSTGRES_USER: vinyl
    POSTGRES_PASSWORD: ci-only
    VINYL_TEST_DB_URL: postgresql+psycopg://vinyl:ci-only@postgres:5432/vinyl_test
  before_script:
    - apt-get update -qq && apt-get install -yqq ffmpeg > /dev/null
    - pip install --quiet uv
    - uv sync --all-packages
  script:
    - uv run ruff check .
    - uv run pytest -q
    - cd server && uv run alembic upgrade head --sql > /dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - meklab-k3s
  script:
    - |
      DEST_ARGS="--destination=${REGISTRY}/${IMAGE_PATH}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DEST_ARGS="$DEST_ARGS --destination=${REGISTRY}/${IMAGE_PATH}:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        DEST_ARGS="$DEST_ARGS --destination=${REGISTRY}/${IMAGE_PATH}:${CI_COMMIT_TAG}"
      fi
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --cache=true \
        --cache-repo="${REGISTRY}/${IMAGE_PATH}/cache" \
        --snapshot-mode=redo \
        --use-new-run \
        $DEST_ARGS
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
