# /etc/wireplumber/wireplumber.conf.d/51-vinyl-scarlett-ignore.conf
#
# Tell the desktop session's PipeWire to leave the Scarlett 2i2 alone: the
# capture daemon opens the ALSA hw device directly (zero-DSP invariant), and
# device access must be exclusive. Without this, the kiosk user's WirePlumber
# grabs the card at login and the recorder gets EBUSY.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        device.nick = "~.*Scarlett.*"
      }
      {
        device.name = "~alsa_card.*"
        device.description = "~.*Scarlett.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
