{% extends "base.html" %}
{% block title %}new set{% endblock %}
{% block content %}
<div class="card">
  <h1>New record set</h1>
  <form method="post" action="/inventory">
    <div class="row">
      <div>
        <label for="disc_count">Discs in the set</label>
        <input type="number" id="disc_count" name="disc_count" value="1" min="1" max="20" required>
      </div>
      <div>
        <label for="speed_rpm">Speed</label>
        <select id="speed_rpm" name="speed_rpm">
          <option value="33" selected>33 1/3 (LP)</option>
          <option value="45">45 (single)</option>
          <option value="78">78 (set aside — phase two)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="has_jacket">Jacket present</label>
        <select id="has_jacket" name="has_jacket">
          <option value="true" selected>Yes</option><option value="false">No</option>
        </select>
      </div>
      <div>
        <label for="has_inner_sleeve">Inner sleeve</label>
        <select id="has_inner_sleeve" name="has_inner_sleeve">
          <option value="true" selected>Yes</option><option value="false">No</option>
        </select>
      </div>
    </div>
    {% with grade="good" %}{% include "partials/condition_picker.html" %}{% endwith %}
    <label for="condition_notes">Anything unusual? (optional)</label>
    <textarea id="condition_notes" name="condition_notes" rows="2"
              placeholder="water damage, name written inside, missing disc 2..."></textarea>
    <button type="submit">Assign accession number</button>
  </form>
</div>
{% endblock %}
