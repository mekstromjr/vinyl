<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vinyl{% endblock %} — meklab vinyl</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #f6f4ef; --card: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
      --accent: #7a4a2b; --accent-ink: #ffffff; --line: #ddd8cf;
      --ok: #2e7d32; --warn: #b26a00; --bad: #b3261e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 17px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
    header { background: var(--accent); color: var(--accent-ink);
             padding: .7rem 1rem; display: flex; align-items: baseline; gap: 1rem; }
    header a { color: var(--accent-ink); text-decoration: none; font-weight: 700; }
    header .who { margin-left: auto; font-size: .85rem; opacity: .8; }
    main { max-width: 46rem; margin: 0 auto; padding: 1rem; }
    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    h1 { font-size: 1.35rem; margin: .2rem 0 .8rem; }
    h2 { font-size: 1.05rem; margin: 0 0 .6rem; color: var(--muted);
         text-transform: uppercase; letter-spacing: .04em; }
    label { display: block; font-size: .9rem; color: var(--muted); margin-top: .7rem; }
    input, select, textarea {
      width: 100%; padding: .65rem; font-size: 1.05rem; margin-top: .25rem;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .row { display: flex; gap: .8rem; } .row > * { flex: 1; }
    button, .btn {
      display: inline-block; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--accent-ink); text-decoration: none;
      font-size: 1.05rem; font-weight: 600; padding: .8rem 1.2rem; margin-top: .9rem;
    }
    button.secondary, .btn.secondary { background: #e9e4da; color: var(--ink); }
    button.danger { background: var(--bad); }
    .big-id { font-size: 2.6rem; font-weight: 800; letter-spacing: .03em;
              font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; border-radius: 999px; padding: .15rem .6rem;
             font-size: .8rem; font-weight: 700; }
    .badge.inventoried { background: #efe6d8; color: var(--warn); }
    .badge.identified { background: #e2efe2; color: var(--ok); }
    .badge.unidentifiable, .badge.excluded { background: #f4dedd; color: var(--bad); }
    .badge.pending { background: #efe6d8; color: var(--warn); }
    .badge.skipped { background: #eee; color: var(--muted); }
    .badge.qc_pass { background: #e2efe2; color: var(--ok); }
    .badge.qc_review { background: #efe6d8; color: var(--warn); }
    .badge.qc_recapture, .badge.qc_pending { background: #f4dedd; color: var(--bad); }
    .badge.task_recapture { background: #f4dedd; color: var(--bad); }
    .badge.task_review { background: #efe6d8; color: var(--warn); }
    .badge.task_capture { background: #e2e8f0; color: #33507a; }
    .badge.task_identify { background: #e9e4da; color: var(--ink); }
    .badge.task_qc_pending { background: #eee; color: var(--muted); }
    .badge.task_uploading { background: #e2e8f0; color: #33507a; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    td, th { padding: .5rem .4rem; border-bottom: 1px solid var(--line); text-align: left; }
    .muted { color: var(--muted); font-size: .9rem; }
    .result { display: flex; gap: .8rem; align-items: center; padding: .6rem;
              border: 1px solid var(--line); border-radius: 10px; margin-top: .6rem; }
    .result img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
    .result .meta { flex: 1; min-width: 0; }
    .result button { margin: 0; padding: .5rem .9rem; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
              gap: .6rem; margin-top: .6rem; }
    .photos figure { margin: 0; }
    .photos .thumb { position: relative; }
    .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;
                  border: 1px solid var(--line); display: block; }
    .photos .remove {
      position: absolute; top: .25rem; right: .25rem; margin: 0; padding: 0;
      width: 1.7rem; height: 1.7rem; line-height: 1; font-size: 1.1rem;
      border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
    }
    .photos figcaption { font-size: .75rem; color: var(--muted); text-align: center; }
    .flag78 { background: var(--bad); color: #fff; border-radius: 8px;
              padding: .6rem .9rem; font-weight: 700; margin-top: .8rem; }
    .htmx-request { opacity: .5; }
    /* Condition grade picker */
    .grade-picker input[type=range] {
      -webkit-appearance: none; appearance: none; height: 10px; padding: 0;
      background: linear-gradient(90deg, var(--ok), var(--warn), var(--bad));
      border-radius: 999px; border: 0; margin-top: .9rem;
    }
    .grade-picker input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
      background: #fff; border: 3px solid var(--accent); cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    .grade-picker input[type=range]::-moz-range-thumb {
      width: 34px; height: 34px; border-radius: 50%;
      background: #fff; border: 3px solid var(--accent); cursor: pointer;
    }
    .grade-picker.ungraded input[type=range] { opacity: .35; }
    .grade-ticks { display: flex; justify-content: space-between;
                   font-size: .75rem; margin-top: .2rem; }
    .grade-readout { margin-top: .5rem; font-size: 1.05rem; }
    .grade-readout strong { text-transform: capitalize; }
    .grade-info-btn {
      margin: 0 0 0 .45rem; padding: 0; width: 1.3rem; height: 1.3rem;
      border-radius: 50%; font: italic 700 .85rem/1.3rem Georgia, serif;
      background: #e9e4da; color: var(--ink); vertical-align: text-bottom;
    }
    .grade-info { margin-top: .7rem; border: 1px solid var(--line);
                  border-radius: 10px; padding: .6rem .8rem; }
    .grade-info summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    .grade-row { display: flex; gap: .8rem; align-items: center;
                 margin-top: .7rem; font-size: .92rem; }
    .grade-row svg { width: 64px; height: 64px; flex: none; }
    .grade-row svg rect { fill: #fff; stroke: var(--ink); stroke-width: 2; }
    .grade-row svg .art { fill: none; stroke: var(--line); stroke-width: 2; }
    .grade-row svg .ring { fill: none; stroke: var(--muted); stroke-width: 1.5;
                           stroke-dasharray: 3 3; opacity: .7; }
    .grade-row svg .wear { fill: var(--line); stroke: var(--muted); stroke-width: 1; }
    .grade-row svg .scuff { stroke: var(--line); stroke-width: 1.5; }
    .grade-row svg .pen { fill: none; stroke: #33507a; stroke-width: 2;
                          stroke-linecap: round; }
    .grade-row svg .split { fill: none; stroke: var(--bad); stroke-width: 2; }
    .grade-row svg .tape { fill: #d9c68f; opacity: .85; stroke: var(--muted);
                           stroke-width: 1; stroke-dasharray: 2 2; }
  </style>
  <script>
  // Condition slider: 1..5 maps onto the grade scale; the hidden field is the
  // submitted truth so an ungraded set stays NULL until the slider is touched.
  const GRADES = [
    ["mint", "perfect — looks unplayed"],
    ["excellent", "very light wear"],
    ["good", "regular wear for its age"],
    ["fair", "writing/drawing, seam split, noticeable damage"],
    ["poor", "barely holding together, or repaired with tape"],
  ];
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".grade-picker").forEach(picker => {
      const slider = picker.querySelector("[data-role=grade-slider]");
      const hidden = picker.querySelector("input[name=condition_grade]");
      const nameEl = picker.querySelector("[data-role=grade-name]");
      const descEl = picker.querySelector("[data-role=grade-desc]");
      const show = idx => {
        const [name, desc] = GRADES[idx - 1];
        slider.value = idx; hidden.value = name;
        nameEl.textContent = name; descEl.textContent = desc;
        picker.classList.remove("ungraded");
      };
      const current = GRADES.findIndex(([n]) => n === picker.dataset.grade);
      if (current >= 0) show(current + 1);
      else picker.classList.add("ungraded");
      slider.addEventListener("input", () => show(Number(slider.value)));
    });
  });
  </script>
</head>
<body>
<header>
  <a href="/">meklab vinyl</a>
  <span class="muted" style="color:#f3e9df">inventory</span>
  {% if username %}<span class="who">{{ username }}</span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
