[project]
name = "vinyl-shared"
version = "0.1.0"
description = "Accession/side IDs + lifecycle states for the vinyl service (imported by worker AND server)."
requires-python = ">=3.12"
# Dependency-light on purpose: stdlib only. The capture worker runs on a 2009
# Core 2 Duo — every dependency here is one it has to install and import.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_shared"]
