# Virtual workspace root for the vinyl digitization service.
#   shared/  -> vinyl-shared : IDs + state machines (worker AND server import this)
#   server/  -> vinyl-server : FastAPI control plane + schema, runs in k3s
# The capture worker (ticket #5) joins as a third member; it must never be a
# dependency of the server (the cluster does not touch audio hardware).
[tool.uv.workspace]
members = ["shared", "server"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "server/tests"]
pythonpath = ["shared/src", "server/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags `Depends()`/`File()`/`Form()` in argument defaults — that IS the
# FastAPI dependency-injection idiom, not the bug the rule hunts.
"server/src/vinyl_server/routers/*" = ["B008"]
